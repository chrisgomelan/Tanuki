<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="tanuki-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="32" height="32" rx="7" fill="url(#tanuki-bg)" />
  
  <!-- Stylized Tanuki Face -->
  <g transform="translate(4, 4)">
    <!-- Ears -->
    <path d="M4 8l3-5 3 3" fill="#0c0d14" stroke="#0c0d14" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M20 8l-3-5-3 3" fill="#0c0d14" stroke="#0c0d14" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner Ears Accent -->
    <path d="M5.5 7l1.5-2.5 1.5 1.5" stroke="#f59e0b" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M18.5 7l-1.5-2.5-1.5 1.5" stroke="#f59e0b" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Head -->
    <circle cx="12" cy="14" r="8" fill="#0c0d14" />
    <!-- Eye Mask / Patches -->
    <ellipse cx="8.5" cy="13" rx="2.4" ry="1.7" fill="#f59e0b" />
    <ellipse cx="15.5" cy="13" rx="2.4" ry="1.7" fill="#f59e0b" />
    <!-- Pupils -->
    <circle cx="8.5" cy="13" r="1" fill="#0c0d14" />
    <circle cx="15.5" cy="13" r="1" fill="#0c0d14" />
    <!-- Snout & Nose -->
    <ellipse cx="12" cy="16.5" rx="1.8" ry="1.2" fill="#1f212d" />
    <path d="M11.2 16h1.6" stroke="#f59e0b" stroke-width="1" stroke-linecap="round" />
    <!-- Mystical Leaf on Forehead -->
    <path d="M12 6c-1-2 1-3 2-3s1 2 0 3-2 0-2 0z" fill="#f59e0b" />
  </g>
</svg>
